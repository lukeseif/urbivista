<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            border: none;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #content {
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h2>Private Access</h2>
    <p>Enter password to continue</p>

    <input type="password" id="password">
    <button onclick="checkPassword()">Enter</button>
</div>

<div id="content">
    <h1>Urbivista AI Testing Area</h1>
    <p>This is the hidden demo environment.</p>
</div>

<script>
    function checkPassword() {
        const password = document.getElementById("password").value;

        if (password === "seemoredecidebetter") {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("content").style.display = "block";
        } else {
            alert("Incorrect password");
        }
    }
</script>

</body>
</html>
