<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private Demo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: "Courier New", monospace;
    }

    .login-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      padding: 40px;
      border-radius: 14px;
      width: 340px;
      text-align: center;
      color: #00ff41;
      box-shadow: 0 0 30px rgba(0,255,65,0.25);
      z-index: 10;
    }

    .login-box h2 {
      margin-top: 0;
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 6px;
      box-sizing: border-box;
      background: #111827;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 6px;
      background: #00ff41;
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
    }

    #matrixCanvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: black;
    }

    #welcomeText,
    #typedText {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff41;
      text-align: center;
      text-shadow:
        0 0 5px #00ff41,
        0 0 15px #00ff41,
        0 0 30px #00ff41;
      z-index: 5;
    }

    #welcomeText {
      display: none;
      font-size: clamp(32px, 5vw, 80px);
      letter-spacing: 4px;
      width: 90%;
      animation: pulse 1.5s infinite alternate;
    }

    #typedText {
      display: none;
      font-size: clamp(20px, 2.5vw, 40px);
      width: 85%;
      max-width: 1000px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @keyframes pulse {
      from {
        opacity: 0.7;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">
    <h2>PRIVATE ACCESS</h2>
    <p>Enter password to continue</p>

    <input
      type="password"
      id="password"
      placeholder="Password"
    />

    <button onclick="checkPassword()">
      ENTER
    </button>
  </div>

  <canvas id="matrixCanvas"></canvas>

  <div id="welcomeText">
    Welcome to the future of site selection
  </div>

  <div id="typedText"></div>

  <script>
    const correctPassword = "seemoredecidebetter";

    function checkPassword() {
      const password =
        document.getElementById("password").value;

      if (password === correctPassword) {
        document.getElementById("loginBox").style.display = "none";
        startSequence();
      } else {
        alert("Incorrect password");
      }
    }

    function startSequence() {

      const canvas =
        document.getElementById("matrixCanvas");

      const ctx =
        canvas.getContext("2d");

      canvas.style.display = "block";

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      const fontSize = 18;

      const columns =
        Math.floor(canvas.width / fontSize);

      const drops = [];

      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
      }

      function drawMatrix() {

        ctx.fillStyle =
          "rgba(0,0,0,0.08)";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.fillStyle = "#00ff41";

        ctx.font =
          fontSize + "px Courier New";

        for (let i = 0; i < drops.length; i++) {

          const text =
            chars.charAt(
              Math.floor(
                Math.random() * chars.length
              )
            );

          ctx.fillText(
            text,
            i * fontSize,
            drops[i] * fontSize
          );

          if (
            drops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
          ) {
            drops[i] = 0;
          }

          drops[i]++;
        }
      }

      const matrixInterval =
        setInterval(drawMatrix, 40);

      setTimeout(() => {

        const welcomeText =
          document.getElementById("welcomeText");

        welcomeText.style.display = "block";

        setTimeout(() => {

          welcomeText.style.display = "none";

          clearInterval(matrixInterval);

          canvas.style.display = "none";

          typeFinalMessage();

        }, 3000);

      }, 3000);
    }

    function typeFinalMessage() {

      const message =
        "Hi, Jon, I hope you found this cool, let's make UrbiVista the best site selection application the world has seen";

      const typedText =
        document.getElementById("typedText");

      typedText.style.display = "block";

      typedText.textContent = "";

      let i = 0;

      function typeCharacter() {

        if (i < message.length) {

          typedText.textContent +=
            message.charAt(i);

          i++;

          setTimeout(typeCharacter, 45);
        }
      }

      typeCharacter();
    }

    window.addEventListener("resize", () => {

      const canvas =
        document.getElementById("matrixCanvas");

      canvas.width = window.innerWidth;

      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
