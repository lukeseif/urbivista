<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Demo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: #00ff41;
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    .login-box {
      background: #111827;
      padding: 40px;
      border-radius: 14px;
      width: 330px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.25);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #00ff41;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #matrixCanvas {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: black;
    }

    #welcomeText, #typedText {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff41;
      text-align: center;
      font-family: "Courier New", monospace;
      text-shadow: 0 0 12px #00ff41;
      padding: 20px;
    }

    #welcomeText {
      font-size: clamp(28px, 5vw, 72px);
      letter-spacing: 3px;
      animation: glow 1.5s infinite alternate;
    }

    #typedText {
      font-size: clamp(20px, 3vw, 42px);
      max-width: 900px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    @keyframes glow {
      from {
        opacity: 0.75;
        text-shadow: 0 0 8px #00ff41;
      }
      to {
        opacity: 1;
        text-shadow: 0 0 25px #00ff41;
      }
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">
    <h2>Private Access</h2>
    <p>Enter password to continue</p>
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
  </div>

  <canvas id="matrixCanvas"></canvas>

  <div id="welcomeText">Welcome to the future of site selection</div>

  <div id="typedText"></div>

  <script>
    const correctPassword = "seemoredecidebetter";

    function checkPassword() {
      const password = document.getElementById("password").value;

      if (password === correctPassword) {
        document.getElementById("loginBox").style.display = "none";
        startMatrixSequence();
      } else {
        alert("Incorrect password");
      }
    }

    function startMatrixSequence() {
      const canvas = document.getElementById("matrixCanvas");
      const ctx = canvas.getContext("2d");

      canvas.style.display = "block";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const characters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const fontSize = 18;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = [];

      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * canvas.height;
      }

      function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff41";
        ctx.font = fontSize + "px Courier New";

        for (let i = 0; i < drops.length; i++) {
          const text = characters.charAt(Math.floor(Math.random() * characters.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }

          drops[i]++;
        }
      }

      const matrixInterval = setInterval(drawMatrix, 40);

      setTimeout(() => {
        clearInterval(matrixInterval);
        canvas.style.display = "none";

        const welcomeText = document.getElementById("welcomeText");
        welcomeText.style.display = "block";

        setTimeout(() => {
          welcomeText.style.display = "none";

          setTimeout(() => {
            typeFinalMessage();
          }, 2000);

        }, 3000);

      }, 3000);
    }

    function typeFinalMessage() {
      const message = "Hi, Jon, I hope you found this cool, let's make UrbiVista the best site selection application the world has seen";
      const typedText = document.getElementById("typedText");

      typedText.style.display = "block";
      typedText.textContent = "";

      let index = 0;

      function typeLetter() {
        if (index < message.length) {
          typedText.textContent += message.charAt(index);
          index++;
          setTimeout(typeLetter, 55);
        }
      }

      typeLetter();
    }

    window.addEventListener("resize", () => {
      const canvas = document.getElementById("matrixCanvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
